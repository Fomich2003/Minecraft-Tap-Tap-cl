# nginx УСЕРЕДИНІ контейнера фронту: лише роздача статики і SPA-фолбек.
# HTTPS, security-хедери, CSP і ліміти — на nginx хоста (tap-tap.fomka.online → 127.0.0.1:8080)

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Бандли Vite мають хеш у назві (index-a1B2c3D4.js): після нового збирання назва інша,
    # тому кешуються назавжди. Файли з public/assets — картинки, під це правило не підпадають
    location ~* ^/assets/.+\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Файли з public/ (іконки, переклади, текстури) без хешу в назві: при заміні мають
    # оновитись у гравців, тож кеш на добу, а не назавжди
    location ~ ^/(assets|items|locales)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # index.html не кешується, інакше після деплою гравець застрягне на старій версії
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: будь-який інший шлях віддає index.html, маршрути розбирає react-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    autoindex off;
}
